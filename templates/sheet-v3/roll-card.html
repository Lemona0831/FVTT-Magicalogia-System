<div class="mglg-card theme-{{theme}} out-{{outcome}}">
  <div class="mglg-card-head">
    <span class="mglg-card-title">{{title}}</span>
    <span class="mglg-card-target">목표치 <b>{{target}}</b></span>
  </div>
  <div class="mglg-card-body">
    <div class="mglg-card-dice">
      {{#each dice}}<span class="mglg-die">{{this}}</span>{{/each}}
      {{#each modifiers}}<span class="mglg-mod">{{this.label}} {{this.value}}</span>{{/each}}
      <span class="mglg-eq">=</span>
      <span class="mglg-total">{{total}}</span>
    </div>
    <div class="mglg-card-result">{{outcomeLabel}}</div>
  </div>
  {{#if doublet}}<div class="mglg-card-doublet">더블릿 · {{doublet}} 마소 2점</div>{{/if}}
  <div class="mglg-card-foot">{{formula}} ≥ {{target}}</div>
</div>
