<div class="mglg-card theme-{{theme}} r{{realmIdx}} out-{{outcome}}{{#if doublet}} doublet{{/if}}">
  <div class="mglg-card-head">
    <div>
      <div class="mglg-card-who">{{actorName}}</div>
      <div class="mglg-card-title">{{title}}</div>
    </div>
    <div class="mglg-card-target"><small>목표</small><b>{{target}}</b></div>
  </div>
  <div class="mglg-card-stage">
    {{#each dice}}
    <div class="mglg-die{{#if this.one}} one{{/if}}">{{#each this.pips}}<i class="mglg-pip{{#if this}} on{{/if}}"></i>{{/each}}</div>
    {{/each}}
    {{#if modifiers.length}}<div class="mglg-mods">{{#each modifiers}}<span class="mglg-mod">{{this.label}} {{this.value}}</span>{{/each}}</div>{{/if}}
    <span class="mglg-eq">=</span>
    <div class="mglg-total">{{total}}</div>
  </div>
  <div class="mglg-card-result"><span>{{outcomeLabel}}</span></div>
  {{#if doublet}}<div class="mglg-card-doublet">✦ 더블릿 · {{doublet}} 마소 2점</div>{{/if}}
  <div class="mglg-card-foot">{{formula}} ≥ {{target}}</div>
</div>
